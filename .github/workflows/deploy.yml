name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zunkireelabs/blue-smoke

jobs:
  checks:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx eslint --max-warnings 50

      - run: npx tsc --noEmit

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:main-${{ github.sha }}
          # Uncomment for NEXT_PUBLIC_* build-time vars (one line per var):
          # build-args: |
          #   NEXT_PUBLIC_SUPABASE_URL=${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          #   NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            REPO="${{ github.event.repository.name }}"
            DIR="/home/zunkireelabs/devprojects/${REPO}-app-prod"
            if [ ! -d "$DIR" ]; then
              echo "==> First deployment — cloning repo"
              git clone -b main git@github.com:${{ github.repository }}.git "$DIR"
            fi
            cd "$DIR"
            git fetch --all --prune
            git reset --hard HEAD
            git checkout -B main origin/main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "Waiting for container to be healthy..."
            sleep 10
            CONTAINER="${REPO}-app-prod"
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then echo "Healthy!"; exit 0; fi
              echo "Attempt $i/18: $STATUS — waiting 10s..."
              sleep 10
            done
            docker logs "$CONTAINER" --tail 50
            exit 1

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify site
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://TODO-SET-PROD-DOMAIN.zunkireelabs.com/) || CODE=000
            if [ "$CODE" = "200" ]; then echo "OK (HTTP $CODE)"; exit 0; fi
            echo "Attempt $i/18: HTTP $CODE — waiting 10s..."
            sleep 10
          done
          echo "Health check failed"
          exit 1
