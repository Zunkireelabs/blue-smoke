name: CI

on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-guard:
    name: Promotion Source Guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch promotion order (feature/fix -> stage -> main)
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          case "$BASE" in
            main)
              case "$HEAD" in
                stage|promote/*)
                  echo "✓ main PR head '$HEAD' is an allowed promotion source." ;;
                *)
                  echo "✗ PRs to main may only come from 'stage' or a 'promote/*' branch (got '$HEAD')."
                  echo "  main is PRODUCTION. Merge feature branches to stage first, then promote"
                  echo "  stage → main. Direct-to-main merges are how main/stage diverge."
                  exit 1 ;;
              esac
              ;;
            stage)
              case "$HEAD" in
                feature/*|fix/*|hotfix/*)
                  echo "✓ stage PR head '$HEAD' matches the feature/fix/hotfix naming convention." ;;
                *)
                  echo "✗ PRs to stage must come from a 'feature/*', 'fix/*', or 'hotfix/*' branch (got '$HEAD')."
                  echo "  See CLAUDE.md branch naming: feature/P1-4.0-bonding-flow, fix/P3-3.0-rssi-flapping."
                  exit 1 ;;
              esac
              ;;
            *)
              echo "✓ base is '$BASE', not main or stage — nothing to enforce."
              ;;
          esac

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Add all build-time env vars required by your framework here.
          # Use secrets from the repository or environment.
          # Examples:
          # VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          # VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          # NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
