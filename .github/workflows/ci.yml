name: CI

on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Add all build-time env vars required by your framework here.
          # Use secrets from the repository or environment.
          # Examples:
          # VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          # VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          # NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
