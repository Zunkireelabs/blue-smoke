name: CI

on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-guard:
    name: Promotion Source Guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch promotion order (feature/fix -> stage -> main)
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          case "$BASE" in
            main)
              case "$HEAD" in
                stage|promote/*)
                  echo "✓ main PR head '$HEAD' is an allowed promotion source." ;;
                *)
                  echo "✗ PRs to main may only come from 'stage' or a 'promote/*' branch (got '$HEAD')."
                  echo "  main is PRODUCTION. Merge feature branches to stage first, then promote"
                  echo "  stage → main. Direct-to-main merges are how main/stage diverge."
                  exit 1 ;;
              esac
              ;;
            stage)
              case "$HEAD" in
                feature/*|fix/*|hotfix/*|chore/*|docs/*)
                  echo "✓ stage PR head '$HEAD' matches an allowed naming convention." ;;
                *)
                  echo "✗ PRs to stage must come from a 'feature/*', 'fix/*', 'hotfix/*', 'chore/*',"
                  echo "  or 'docs/*' branch (got '$HEAD')."
                  echo "  See CLAUDE.md branch naming: feature/P1-4.0-bonding-flow, fix/P3-3.0-rssi-flapping."
                  echo "  Use chore/* for tooling and repo housekeeping, docs/* for documentation-only work."
                  exit 1 ;;
              esac
              ;;
            *)
              echo "✓ base is '$BASE', not main or stage — nothing to enforce."
              ;;
          esac

  verify:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # React Native app (P0-4.0) — no web `npm run build`. The full EAS build +
      # privacy-guard + backend gates land in P0-5.0; this runs the code checks the
      # scaffold actually ships with.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `test:ci` is `jest --forceExit`, deliberately NOT the same as local `npm test`.
      # 2026-09-01: the app suite leaks a handle that stops Node exiting AFTER every test has
      # passed and Jest has printed its summary — reproduced locally at `--maxWorkers=2
      # --detectOpenHandles` (64/64 suites passed, summary printed, then the process sat there
      # until killed). On CI's 2-4 workers this wedged the job for 58 minutes with zero output.
      # `--forceExit` makes the process exit once the run is genuinely finished; it does not mask
      # a failing test, which still fails the job normally. Local `npm test` stays strict so the
      # underlying leak stays visible to whoever fixes it properly — see docs/session-log/sadin.md.
      - name: Runner specs
        run: |
          node -e "const os=require('os');console.log('node',process.version,'cpus',os.cpus().length,'mem',(os.totalmem()/1e9).toFixed(1)+'GB')"
          nproc; free -m || true

      # DIAGNOSTIC 1 — which file does the worker never finish, and is it spinning or blocked?
      - name: Diag A (workers, as CI runs today)
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/jest/bin/jest.js --logHeapUsage \
            --reporters=default --reporters=./tools/jest/startReporter.js &
          JPID=$!
          for i in $(seq 1 30); do
            sleep 10
            kill -0 $JPID 2>/dev/null || { echo "== jest exited on its own after ~$((i*10))s =="; break; }
          done
          if kill -0 $JPID 2>/dev/null; then
            echo "===== WEDGED — process snapshot (STAT/%CPU shows spin vs block) ====="
            ps -eo pid,ppid,stat,pcpu,pmem,rss,etime,args | grep -i node | grep -v grep
            echo "===== kernel wait channel per node pid ====="
            for p in $(pgrep -f "jest" 2>/dev/null); do
              echo "--- pid $p wchan=$(cat /proc/$p/wchan 2>/dev/null) ---"
              grep -E "^(State|Threads|VmRSS)" /proc/$p/status 2>/dev/null
            done
            kill -9 $JPID 2>/dev/null; pkill -9 -f jest 2>/dev/null
          fi
          exit 0

      # DIAGNOSTIC 2 — same suite with no worker process at all. If this passes, the wedge is in
      # worker orchestration; if it hangs too, it is the test code itself.
      - name: Diag B (runInBand, no worker process)
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/jest/bin/jest.js --runInBand --logHeapUsage \
            --reporters=default --reporters=./tools/jest/startReporter.js &
          JPID=$!
          for i in $(seq 1 30); do
            sleep 10
            kill -0 $JPID 2>/dev/null || { echo "== in-band jest exited on its own after ~$((i*10))s =="; break; }
          done
          if kill -0 $JPID 2>/dev/null; then
            echo "===== IN-BAND ALSO WEDGED ====="
            ps -eo pid,ppid,stat,pcpu,pmem,rss,etime,args | grep -i node | grep -v grep
            kill -9 $JPID 2>/dev/null; pkill -9 -f jest 2>/dev/null
          fi
          exit 0

      # Only gate that actually loads the app the way Metro does — typecheck/lint/test
      # all resolve zod's CJS build and would stay green through an ESM-only bundle break.
      - name: Bundle check
        run: npm run bundle:check
