services:
  blue-smoke-app-stage:
    image: ghcr.io/zunkireelabs/blue-smoke:stage
    container_name: blue-smoke-app-stage
    restart: unless-stopped
    env_file:
      - .env.local                    # runtime secrets — set once on VPS, never committed
    networks:
      - hosting
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      # HTTPS router
      - "traefik.http.routers.blue-smoke-app-stage.rule=Host(`TODO-SET-STAGING-DOMAIN.zunkireelabs.com`)"
      - "traefik.http.routers.blue-smoke-app-stage.entrypoints=websecure"
      - "traefik.http.routers.blue-smoke-app-stage.tls=true"
      - "traefik.http.routers.blue-smoke-app-stage.tls.certresolver=letsencrypt"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.blue-smoke-app-stage-http.rule=Host(`TODO-SET-STAGING-DOMAIN.zunkireelabs.com`)"
      - "traefik.http.routers.blue-smoke-app-stage-http.entrypoints=web"
      - "traefik.http.routers.blue-smoke-app-stage-http.middlewares=blue-smoke-app-stage-redirect"
      - "traefik.http.middlewares.blue-smoke-app-stage-redirect.redirectscheme.scheme=https"
      # Service port
      - "traefik.http.services.blue-smoke-app-stage.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  hosting:
    external: true
